name: Build test lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet tool restore
      - run: dotnet restore AussieAlerts.slnx -m:1
      - run: dotnet build AussieAlerts.slnx -m:1 --no-restore -c Release
      - name: C# formatting
        run: dotnet format whitespace . --folder --include src tests --exclude src/Api/obj src/Api/bin tests/Api.Tests/obj tests/Api.Tests/bin --verify-no-changes
      - name: xUnit and real PostgreSQL Testcontainers tests
        run: dotnet test tests/Api.Tests --no-build -c Release --logger trx
      - run: dotnet ef migrations has-pending-model-changes --project src/Api
      - run: npm ci --prefix web
      - name: Check generated API contract
        shell: bash
        run: |
          node scripts/setup.mjs
          node scripts/run-api.mjs --contract > api-contract.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          for i in {1..60}; do
            if curl --fail --silent http://localhost:8080/health/live; then break; fi
            sleep 1
          done
          node scripts/export-openapi.mjs
          npm --prefix web run generate:api
          git diff --exit-code -- openapi.json web/src/api/schema.d.ts
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Build production container
        run: docker build --target production -t aussie-alerts:ci .

  deploy:
    name: Build, push and deploy backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: azure-aussie-alerts-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      IMAGE_REF: ghcr.io/balaram-shiwakoti/aussie-alerts:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image (API + bundled React build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Sync database + JWT secrets to Container App
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          az containerapp secret set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets \
              "database-url=$DATABASE_URL" \
              "jwt-key=$JWT_KEY" \
            --output none

      - name: Fix ingress target port (app listens on 8080, not the default 80)
        run: |
          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 8080 \
            --output none

      - name: Deploy image and runtime configuration
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_REF" \
            --min-replicas 0 --max-replicas 2 \
            --set-env-vars \
              "ASPNETCORE_ENVIRONMENT=Production" \
              "ConnectionStrings__Database=secretref:database-url" \
              "Jwt__Key=secretref:jwt-key" \
              "Database__AutoMigrate=true" \
              "Seed__Enabled=false" \
            --output none

      - name: Wait for the app to become healthy
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in {1..60}; do
            if curl --silent --fail "https://$fqdn/health/live"; then
              echo "App is live"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy in time; inspect Container Apps logs/revisions."
          exit 1
